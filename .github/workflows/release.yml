name: release

# Tag-triggered. CI artifacts expire after 90 days and live on a run page
# nobody thinks to visit; a release is permanent and sits on the repository
# front page, which is where someone looking for a binary actually looks.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write        # needed to create the release

jobs:
  # All three platforms, as of v0.2.1.
  #
  # This was Windows-only on the rule that a release is a claim someone ran the
  # thing, and only Windows had been run. That has stopped being true, so the
  # Linux and macOS jobs are back.

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The tag, not the branch.
      #
      # On a tag push these are the same thing. On workflow_dispatch they are
      # not: checkout defaults to the branch the run was dispatched from, so
      # naming a tag built main's code and attached it to that tag's release -
      # assets that do not match the commit they claim to be.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            git
            make zip python
      - name: raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC -j2
          mkdir -p /tmp/rl/include /tmp/rl/lib
          cp /tmp/raylib/src/raylib.h /tmp/raylib/src/raymath.h /tmp/raylib/src/rlgl.h /tmp/rl/include/
          cp /tmp/raylib/src/libraylib.a /tmp/rl/lib/
      - name: Build
        run: |
          RAYLIB=/tmp/rl make
          make test

      # Do not ship a release whose window shows the wrong icon.
      - name: The icon is the one GLFW will use
        run: python tools/check_win_icon.py bencsynth.exe

      # Static, so a downloaded binary does not need MSYS2's DLLs on PATH.
      - name: No MSYS2 DLL dependencies
        run: |
          if objdump -p bencsynth.exe | grep -iE 'DLL Name:.*(raylib|libgcc|libwinpthread|libstdc|msys)'; then
            echo "links a DLL that will not be present on a user's machine"
            exit 1
          fi
          echo "self-contained"

      - name: Package the program
        run: |
          # Same trap as the publish job had: on workflow_dispatch
          # GITHUB_REF_NAME is the branch, so this shipped a zip called
          # bencsynth-main-windows-x86_64.zip. The input wins when it is set.
          V="${{ github.event.inputs.tag }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME:-dev}"
          D="bencsynth-$V-windows-x86_64"
          mkdir -p "$D"
          cp bencsynth.exe README.md ARCHITECTURE.md LICENSE NOTICE "$D"/
          cp -r assets "$D"/
          zip -qr "$D.zip" "$D"
          ls -l ./*.zip
      - uses: actions/upload-artifact@v4
        with: { name: pkg-windows, path: 'bencsynth-*-windows-x86_64.zip', if-no-files-found: error }

      # The CLAP and the LV2, from the same toolchain. The VST3 is built
      # separately with MSVC - it shares no code with these, so it does not
      # have to share a compiler either.
      - name: Build the plugins
        run: |
          make clap-fetch
          make clap
          # LV2 headers straight from the release, as ci.yml does. Without
          # this the release quietly shipped an installer with no LV2 section
          # while the workflow reported success.
          curl -sL -o /tmp/lv2.tar.gz \
            https://github.com/lv2/lv2/archive/refs/tags/v1.18.10.tar.gz
          tar -xzf /tmp/lv2.tar.gz -C /tmp
          LV2_INCLUDE=/tmp/lv2-1.18.10/include make lv2
          test -f build/bencsynth.lv2/bencsynth.dll
      - name: The plugins are self-contained
        run: |
          for f in build/bencsynth.clap; do
            if objdump -p "$f" | grep -iE 'DLL Name:.*(libgcc|libwinpthread|libstdc|msys)'; then
              echo "$f imports a runtime DLL a host will not have"
              exit 1
            fi
          done
          objdump -p build/bencsynth.clap | grep -q clap_entry
          echo "self-contained"
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-msys2
          path: |
            build/bencsynth.clap
            build/bencsynth.lv2
          if-no-files-found: error

  # MSVC, because the VST3 SDK expects it. Nothing of ours is linked in: the
  # wrapper finds bencsynth.clap at runtime.
  windows-vst3:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The tag, not the branch.
      #
      # On a tag push these are the same thing. On workflow_dispatch they are
      # not: checkout defaults to the branch the run was dispatched from, so
      # naming a tag built main's code and attached it to that tag's release -
      # assets that do not match the commit they claim to be.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # Explicitly rather than through the Makefile: this runner has Git Bash,
      # not MSYS2, and make clap-fetch does not survive the difference.
      - name: clap-wrapper and the SDKs
        shell: bash
        run: |
          mkdir -p vendor
          curl -sL -o /tmp/clap.tar.gz \
            https://github.com/free-audio/clap/archive/refs/tags/1.2.10.tar.gz
          tar xzf /tmp/clap.tar.gz -C vendor
          mv vendor/clap-1.2.10 vendor/clap
          git clone -q --depth 1 --branch v0.15.1 \
            https://github.com/free-audio/clap-wrapper.git vendor/clap-wrapper
          git clone -q --depth 1 \
            https://github.com/steinbergmedia/vst3sdk.git vendor/vst3sdk
          cd vendor/vst3sdk && git submodule update --init --depth 1 \
            base pluginterfaces public.sdk cmake
      # This job configures cmake itself rather than going through the
      # Makefile, so it has to read the version the same way the Makefile does.
      - name: Which version
        shell: bash
        run: |
          V=$(awk '/^#define BS_VERSION_(MAJOR|MINOR|PATCH)/ {printf "%s%s", sep, $3; sep="."}' src/core/bs_version.h)
          echo "BS_VERSION=$V" >> "$GITHUB_ENV"
          echo "version $V"
      - name: Build
        shell: pwsh
        run: |
          cmake -S cmake -B build/vst3 -A x64 `
            -DBS_VERSION="$env:BS_VERSION" `
            -DCLAP_WRAPPER_DIR="$env:GITHUB_WORKSPACE/vendor/clap-wrapper" `
            -DCLAP_SDK_ROOT="$env:GITHUB_WORKSPACE/vendor/clap" `
            -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vendor/vst3sdk"
          cmake --build build/vst3 --target bencsynth_as_vst3 --config Release
      - name: Collect it
        shell: bash
        run: |
          B=$(find build/vst3 -name 'bencsynth.vst3' -maxdepth 3 | head -1)
          test -n "$B"
          mkdir -p out && cp -r "$B" out/
          find out -type f
      - uses: actions/upload-artifact@v4
        with: { name: plugins-vst3, path: out/**, if-no-files-found: error }

  # ---------------------------------------------------------------- linux
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The tag, not the branch. See the windows job for why.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: X11, GL and ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev xvfb \
            lv2-dev
      # From source and static, not from apt: a release binary linked against
      # the runner image's libraylib needs that exact library on the machine
      # that downloaded it, which is no machine at all.
      - name: raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build
      - name: Build and test
        run: |
          RAYLIB=/tmp/rl make
          make test
      - name: The plugins
        run: |
          make clap-fetch
          make vst3-fetch
          RAYLIB=/tmp/rl make clap
          make lv2
          make vst3
      # The check that would have caught shipping a plugin that cannot load:
      # the .clap must not need raylib or GLFW, because the host process has
      # neither. The editor is a separate executable for exactly this reason.
      - name: The plugin needs nothing from raylib or GLFW
        run: |
          # Not 'Rl[A-Z]' with -i, which was the first attempt: it matches the
          # "rle" in strlen, so the check failed on libc.
          if nm -D --undefined-only build/bencsynth.clap | grep -iE 'glfw|raylib|InitWindow|BeginDrawing'; then
            echo "the plugin wants a window library it will not find in a host"
            exit 1
          fi
          echo "clean"
      - name: It runs
        run: |
          make clap-test
          make lv2-test
          xvfb-run -a -s "-screen 0 1440x900x24" ./bencsynth --shot rel.png --frames 90
      # Tarred, not zipped: the zip format as GitHub writes it drops the
      # executable bit, so a downloaded binary needs a chmod nobody expects.
      - name: Package
        run: |
          V="$VERSION"
          [ -n "$V" ] || V="${{ github.event.inputs.tag }}"
          [ -n "$V" ] || V="$GITHUB_REF_NAME"
          mkdir -p dist

          D="bencsynth-$V-linux-x86_64"
          mkdir -p "$D"
          cp bencsynth README.md ARCHITECTURE.md LICENSE NOTICE "$D"/
          cp -r assets "$D"/
          tar czf "dist/$D.tar.gz" "$D"

          # The editor goes in the plugin pack for the same reason it goes in
          # the Windows one: the CLAP opens the rack by running it.
          P="bencsynth-$V-linux-plugins"
          mkdir -p "$P"
          cp -r build/bencsynth.clap build/bencsynth.lv2 build/bencsynth.vst3 "$P"/
          cp bencsynth "$P"/
          cp -r assets "$P"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$P"/
          cp .github/plugin-install.md "$P"/INSTALL.md
          tar czf "dist/$P.tar.gz" "$P"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: pkg-linux, path: 'dist/*.tar.gz', if-no-files-found: error }

  # ---------------------------------------------------------------- macos
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      # The tag, not the branch. See the windows job for why.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # Universal, because the executable is built universal below and a
      # single-architecture raylib underneath it will not link.
      - name: raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build
          lipo -info /tmp/rl/lib/libraylib.a | tail -1
      - name: Build and test
        run: |
          RAYLIB=/tmp/rl MACOS_UNIVERSAL=1 make
          make test
      # The plugins have been universal since v0.1.0; the executable has not,
      # and it is the plugin's editor. An arm64 editor inside a universal
      # plugin is a plugin that loads on an Intel Mac and never opens.
      - name: The executable is universal
        run: |
          lipo -info bencsynth
          lipo -info bencsynth | grep -q x86_64
          lipo -info bencsynth | grep -q arm64
      - name: No non-system dynamic libraries
        run: |
          otool -L bencsynth
          # Only the indented lines. otool prints an unindented header per
          # architecture, so on a universal binary "tail -n +2" leaves
          # "bencsynth (architecture arm64):" in the stream and the check
          # reports the binary's own name as a library it cannot find.
          if otool -L bencsynth | grep -E '^[[:space:]]' | \
             grep -vE '^[[:space:]]+(/usr/lib/|/System/)'; then
            echo "links a library that will not be present on a stock macOS"
            exit 1
          fi
          echo "self-contained"
      # The CLAP only. macos-plugin-dmg.sh stages the .app, the .clap and the
      # .vst3, and there is no LV2 in the image for the same reason there is no
      # LV2 job in ci.yml's macOS lane - nothing on this platform is asking for
      # one that cannot take the CLAP instead.
      - name: The plugins
        run: |
          make clap-fetch
          make au-fetch
          MACOS_UNIVERSAL=1 make clap
          make clap-test
          # AU, which is the only one of these Logic and GarageBand will load.
          # Universal by its own cmake flag, not MACOS_UNIVERSAL.
          make au
      - name: dmgbuild
        run: |
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install --quiet dmgbuild
          /tmp/dmgvenv/bin/dmgbuild --help >/dev/null
      - name: Which version
        run: |
          V="${{ github.event.inputs.tag }}"
          [ -n "$V" ] || V="$GITHUB_REF_NAME"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: The .app bundle
        run: |
          BS_VERSION="${VERSION#v}" ./tools/macos-app.sh bencsynth BENCsynth.app
          # Finder decides an app is an app from these two facts alone.
          plutil -lint BENCsynth.app/Contents/Info.plist
          test "$(plutil -extract CFBundleExecutable raw \
                    BENCsynth.app/Contents/Info.plist)" = BENCsynth
          test "$(plutil -extract CFBundlePackageType raw \
                    BENCsynth.app/Contents/Info.plist)" = APPL
          # A release must not ship a bundle macOS will call damaged.
          codesign --verify --deep --strict --verbose=2 BENCsynth.app
      # No architecture in the name any more, and no version in the volume
      # name. The first because there is only one build now and calling it
      # arm64 would be a lie; the second because the volume name becomes the
      # mounted disk's name, and "BENCsynth" is what belongs on a desktop.
      - name: The disk image
        run: |
          mkdir -p dist
          DMG="dist/bencsynth-$VERSION-macos-universal.dmg"
          DMGBUILD=/tmp/dmgvenv/bin/dmgbuild \
            ./tools/macos-dmg.sh BENCsynth.app "$DMG" BENCsynth
          # A release must not quietly ship the unstyled fallback either.
          mkdir -p /tmp/dmg
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/dmg
          ls -la /tmp/dmg
          test -f /tmp/dmg/.DS_Store
          test -L /tmp/dmg/Applications
          test -d /tmp/dmg/BENCsynth.app
          test -f /tmp/dmg/BENCsynth.app/Contents/Resources/BENCsynth.icns
          test -f /tmp/dmg/BENCsynth.app/Contents/Resources/assets/fonts/TerminusTTF.ttf
          hdiutil detach /tmp/dmg
      - name: The plugin disk image
        run: |
          P="dist/bencsynth-$VERSION-macos-plugins.dmg"
          DMGBUILD=/tmp/dmgvenv/bin/dmgbuild \
            ./tools/macos-plugin-dmg.sh "$P" "BENCsynth Plug-Ins"
          mkdir -p /tmp/pdmg
          hdiutil attach -nobrowse -readonly -noverify -noautoopen \
            -mountpoint /tmp/pdmg "$P"
          ls -la /tmp/pdmg
          test -d /tmp/pdmg/bencsynth.clap
          test -d /tmp/pdmg/BENCsynth.component
          test -d /tmp/pdmg/BENCsynth.app
          test -x "/tmp/pdmg/Install Plug-Ins.command"
          test -L /tmp/pdmg/Applications
          test -f /tmp/pdmg/README.txt
          # The signature has to survive being put in an image: an invalid one
          # is exactly the state macOS calls "damaged".
          codesign --verify --deep --strict --verbose=2 /tmp/pdmg/bencsynth.clap
          codesign --verify --deep --strict --verbose=2 /tmp/pdmg/BENCsynth.component
          codesign --verify --deep --strict --verbose=2 /tmp/pdmg/BENCsynth.app
          lipo -info /tmp/pdmg/BENCsynth.component/Contents/MacOS/BENCsynth | grep -q x86_64
          # And the editor inside the image is still both architectures.
          lipo -info /tmp/pdmg/BENCsynth.app/Contents/MacOS/BENCsynth | grep -q x86_64
          hdiutil detach /tmp/pdmg
          ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: pkg-macos, path: 'dist/*.dmg', if-no-files-found: error }

  publish:
    needs: [windows, windows-vst3, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The tag, not the branch.
      #
      # On a tag push these are the same thing. On workflow_dispatch they are
      # not: checkout defaults to the branch the run was dispatched from, so
      # naming a tag built main's code and attached it to that tag's release -
      # assets that do not match the commit they claim to be.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - run: ls -lR dl

      # On a tag push GITHUB_REF_NAME is the tag; on workflow_dispatch it is
      # the branch, which is how a previous run tried to publish a release
      # called "main". The input wins whenever it is set.
      - name: Which version
        run: |
          V="${{ github.event.inputs.tag }}"
          [ -n "$V" ] || V="$GITHUB_REF_NAME"
          case "$V" in v*) ;; *) echo "refusing to release '$V' - not a v tag"; exit 1;; esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "releasing $V"

      # And the tag has to be the version the code thinks it is. v0.2.2 shipped
      # plugins reporting 0.1.0 and a component reporting 1.1.1.
      - name: The tag matches the source
        run: tools/check_version.sh "$VERSION"

      # One plugin bundle rather than three downloads, and the executable goes
      # in it: the CLAP's editor IS the standalone binary, so a plugin pack
      # without it opens to a generic parameter list and nothing else.
      # One thing to download and double-click, which upgrades whatever is
      # already there rather than sitting beside it.
      - name: NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Assemble the installer
        run: |
          V="$VERSION"
          rm -rf stage && mkdir -p stage
          unzip -qo dl/pkg-windows/*.zip -d /tmp/std   # -o: the installer step unpacked this too
          cp /tmp/std/*/bencsynth.exe stage/
          cp -r /tmp/std/*/assets stage/
          cp dl/plugins-msys2/bencsynth.clap stage/
          cp -r dl/plugins-msys2/bencsynth.lv2 stage/ 2>/dev/null || \
            echo "no LV2 in this build - the installer will skip that section"
          cp -r dl/plugins-vst3/bencsynth.vst3 stage/
          cp README.md LICENSE NOTICE ARCHITECTURE.md stage/
          ls -R stage | head -30
          # Absolute. makensis resolves a relative source path against the
          # script's own directory rather than the working directory, so
          # "assets/icon/..." was looked for under tools/ and reported as an
          # icon that could not be opened, three macros deep.
          mkdir -p dist
          makensis -DVERSION="$V" \
                   -DSRCDIR="$PWD/stage" \
                   -DICONFILE="$PWD/assets/icon/bencsynth.ico" \
                   -DOUTFILE="$PWD/dist/bencsynth-$V-windows-setup.exe" \
                   tools/windows-installer.nsi
          ls -l dist/*setup.exe

      - name: Assemble the plugin pack
        run: |
          V="$VERSION"
          D="bencsynth-$V-windows-plugins"
          mkdir -p "$D"
          cp dl/plugins-msys2/bencsynth.clap "$D"/
          cp -r dl/plugins-vst3/bencsynth.vst3 "$D"/
          unzip -qo dl/pkg-windows/*.zip -d /tmp/std   # -o: the installer step unpacked this too
          cp /tmp/std/*/bencsynth.exe "$D"/
          cp -r /tmp/std/*/assets "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          cp .github/plugin-install.md "$D"/INSTALL.md
          mkdir -p dist
          zip -qr "dist/$D.zip" "$D"
          cp dl/pkg-windows/*.zip dist/
          ls -l dist

      # Built and checked in their own jobs; this only collects them.
      - name: The Linux and macOS builds
        run: |
          cp dl/pkg-linux/*.tar.gz dist/
          cp dl/pkg-macos/*.dmg dist/
          ls -l dist

      # Nine assets across three platforms is enough to get wrong quietly. A
      # release missing its macOS image because an upload glob did not match is
      # a release nobody notices is broken until somebody looks for the file.
      - name: Every platform is actually here
        run: |
          V="$VERSION"
          for f in "bencsynth-$V-windows-setup.exe" \
                   "bencsynth-$V-windows-plugins.zip" \
                   "bencsynth-$V-windows-x86_64.zip" \
                   "bencsynth-$V-linux-x86_64.tar.gz" \
                   "bencsynth-$V-linux-plugins.tar.gz" \
                   "bencsynth-$V-macos-universal.dmg" \
                   "bencsynth-$V-macos-plugins.dmg"; do
            test -s "dist/$f" || { echo "missing or empty: $f"; exit 1; }
            echo "  ok  $f"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$VERSION"
          gh release create "$V" dist/* \
            --title "BENCsynth $V" \
            --notes-file .github/release-notes.md \
            --verify-tag || \
          gh release upload "$V" dist/* --clobber
