name: build

# The README claims BENCsynth builds on Linux, macOS and Windows. This is what
# turns that claim into something verified rather than asserted.
#
# Every job that builds something keeps it. An earlier version of this file
# built all three platforms and uploaded a screenshot and a .wav - so CI proved
# the binaries linked and then deleted them, which is most of the reason to run
# it on three platforms in the first place.
#
# How each platform's build is packaged is not cosmetic. See the comments on
# the upload steps: the artifact zip GitHub writes does not carry the
# executable bit, and on macOS that alone is enough to turn a working
# application into one the system calls damaged.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # The DSP core links no raylib and needs no sound card, which is the property
  # that makes a plugin possible later. Checked first and on its own, because if
  # it ever stops being true the three GUI jobs below would still pass and
  # nothing would say so.
  core:
    name: core (no raylib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Cheap, and it guards a claim the code makes about itself: bs_version.h
      # says it is the one place a version lives.
      - name: One version, everywhere
        run: tools/check_version.sh

      - name: Build the core and run the tests
        run: |
          make core
          make test
      - name: The core really does not link raylib
        run: |
          if nm -uC libbencsynth.a | grep -iE 'raylib|glfw|InitWindow|BeginDrawing'; then
            echo "the core has picked up a dependency on the windowing library"
            exit 1
          fi
          echo "clean"
      - name: Render a phrase offline
        run: |
          make render
          ls -l bencsynth-demo.wav
      - uses: actions/upload-artifact@v4
        with:
          name: demo-audio
          path: bencsynth-demo.wav
          if-no-files-found: error

  # The plugin is the one part that cannot be checked by compiling it. A bundle
  # that builds, exports lv2_descriptor and validates as Turtle can still
  # connect the wrong port to the wrong buffer or hand back state it cannot
  # read again - so this loads it the way a host does and plays it.
  lv2:
    name: lv2 plugin (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: LV2 headers and tools
        run: |
          sudo apt-get update
          # lilv is the library LMMS itself loads LV2 plugins with, so having
          # its command-line tools here means the discovery check below is the
          # same discovery a host does.
          sudo apt-get install -y lv2-dev lilv-utils
          # lv2_validate is a shell script that calls sord_validate, which
          # lives in a different package whose name has moved around between
          # distributions - so this is best-effort, and make lv2-validate
          # skips with a note when it is absent. The lilv checks below are the
          # ones that are enforced, and they are the better checks anyway:
          # they ask the library a host actually loads plugins with.
          sudo apt-get install -y sordi || sudo apt-get install -y sord-utils || true
      - name: Build the bundle
        run: |
          make lv2
          make render      # to count the racks the TTL is meant to list
      - name: It describes itself correctly
        run: make lv2-validate
      # Generated from the preset table rather than written out, so the check
      # is that the two agree - a Turtle file listing 30 racks for a build with
      # 37 is a menu that is quietly missing the last seven.
      - name: The rack port lists every rack
        run: |
          N=$(./bencsynth-render 2>&1 | grep -c '^  ')
          T=$(grep -c 'lv2:scalePoint' build/bencsynth.lv2/bencsynth.ttl)
          echo "presets $N, scale points $T"
          test "$N" = "$T"

      # Stronger than validating the Turtle in isolation: this asks lilv to go
      # looking for plugins the way a host does and checks that ours is one of
      # the things it finds. A bundle can be valid RDF and still be invisible.
      # The system path is on LV2_PATH as well as the bundle, and not as a
      # convenience: LV2_PATH replaces the default rather than adding to it, so
      # with only the bundle on it lilv cannot see lv2core.ttl, cannot resolve
      # lv2:InstrumentPlugin as a subclass of lv2:Plugin, and reports the
      # plugin's class as the generic "Plugin". Nothing is wrong with the
      # bundle when that happens; the search path is just missing the
      # vocabulary. A host has both.
      - name: lilv finds it, the way a host would
        run: |
          export LV2_PATH="$PWD/build:/usr/lib/lv2"
          lv2ls | tee /tmp/found.txt
          grep -q 'bropple/BENCsynth' /tmp/found.txt
          echo "discovered"
      - name: And it reports itself as an instrument with the right ports
        run: |
          export LV2_PATH="$PWD/build:/usr/lib/lv2"
          lv2info 'https://github.com/bropple/BENCsynth' | tee /tmp/info.txt
          grep -qi 'Instrument' /tmp/info.txt
          # Twelve: MIDI in, two audio out, eight macros, and the rack. This is
          # the seam an LV2 plugin has no compiler to guard - the Turtle and the
          # port enum in the C have to agree, and nothing makes them. Adding the
          # rack port without touching this is what caught it.
          test "$(grep -cE '^	Port [0-9]+:' /tmp/info.txt)" = 12
          grep -q 'state#interface' /tmp/info.txt
      - name: It loads, plays and restores its state
        run: make lv2-test
      - name: The bundle is what a host expects to find
        run: |
          ls -l build/bencsynth.lv2
          test -f build/bencsynth.lv2/manifest.ttl
          test -f build/bencsynth.lv2/bencsynth.ttl
          test -f build/bencsynth.lv2/bencsynth.so
          # lv2_descriptor must be visible, or a host sees a library with no
          # plugin in it and says nothing useful about why.
          nm -D --defined-only build/bencsynth.lv2/bencsynth.so | grep -q lv2_descriptor
          echo "ok"
      - name: Package
        run: |
          D="bencsynth-lv2-$(git rev-parse --short HEAD)"
          mkdir -p "$D"
          cp -r build/bencsynth.lv2 "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          tar czf "$D.tar.gz" "$D"
          echo "PKG=$D.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-lv2-linux
          path: ${{ env.PKG }}
          if-no-files-found: error

  # CLAP: MIT, no SDK licence, and clap-wrapper turns one of these into VST3
  # and AU later. Headers only, so there is nothing to install but a tarball.
  clap:
    name: clap plugin (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: CLAP headers
        run: make clap-fetch
      - name: Build
        run: make clap
      - name: It loads, plays, switches racks and restores its state
        run: make clap-test
      # The editor is a separate process with a raylib window, so this needs a
      # display - and it is the only check that the two halves actually talk:
      # it starts the real binary against a real shared block and waits for it
      # to publish the rack it was handed.
      - name: X11 and GL, for the editor process
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libasound2-dev
      - name: raylib, so the editor can be built
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC -j2
          mkdir -p /tmp/rl/include /tmp/rl/lib
          cp /tmp/raylib/src/raylib.h /tmp/raylib/src/raymath.h /tmp/raylib/src/rlgl.h /tmp/rl/include/
          cp /tmp/raylib/src/libraylib.a /tmp/rl/lib/
      - name: The plugin and its editor talk to each other
        run: RAYLIB=/tmp/rl xvfb-run -a --server-args="-screen 0 1400x900x24" make ipc-test
      - name: And the plugin really starts one
        run: |
          RAYLIB=/tmp/rl make
          BENCSYNTH_EDITOR=./bencsynth xvfb-run -a \
            --server-args="-screen 0 1400x900x24" \
            ./bencsynth-clap-host build/bencsynth.clap
      # The plugin and the editor are separate programs that happen to share a
      # repository. The editor links raylib; the plugin must not, and must not
      # depend on anything it provides. A shared object accepts undefined
      # symbols at link time and the host discovers them at load - or worse,
      # resolves them against its own copy. bs_embed.cpp being in the wrong
      # source list left glfwGetX11Window undefined here exactly once.
      - name: The plugin needs nothing from raylib or GLFW
        run: |
          if nm -D --undefined-only build/bencsynth.clap | grep -iE 'glfw|raylib'; then
            echo "the plugin depends on a symbol only the editor has"
            exit 1
          fi
          echo "self-contained"

      - name: clap_entry survives -fvisibility=hidden
        run: |
          # CLAP_EXPORT has to beat the hidden default, or a host opens the
          # library, finds no entry point, and reports nothing useful.
          nm -D --defined-only build/bencsynth.clap | grep -q clap_entry
      - name: Package
        run: |
          D="bencsynth-clap-linux-$(git rev-parse --short HEAD)"
          mkdir -p "$D"
          cp -r build/bencsynth.clap "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          tar czf "$D.tar.gz" "$D"
          echo "PKG=$D.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-clap-linux
          path: ${{ env.PKG }}
          if-no-files-found: error

  clap-windows:
    name: clap plugin (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            git
            make
            zip
            tar
      - name: CLAP headers
        run: make clap-fetch
      - name: Build
        run: make clap
      - name: It is a PE, and the entry point is exported
        run: |
          ls -l build/bencsynth.clap
          file build/bencsynth.clap | grep -qi "PE32+"
          objdump -p build/bencsynth.clap | grep -q clap_entry
      # Same check the LV2 and the executable get: a host will not have MSYS2's
      # runtime DLLs on its PATH, and LoadLibrary failing is indistinguishable
      # from the plugin not being installed.
      - name: No MSYS2 DLL dependencies
        run: |
          if objdump -p build/bencsynth.clap | \
             grep -iE 'DLL Name:.*(libgcc|libwinpthread|libstdc|msys)'; then
            echo "the plugin imports a runtime DLL a host will not have"
            exit 1
          fi
          echo "ok - self-contained"
      - name: Package
        run: |
          D="bencsynth-clap-windows-$(git rev-parse --short HEAD)"
          mkdir -p "$D"
          cp build/bencsynth.clap "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          zip -r "$D.zip" "$D"
          echo "PKG=$D.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-clap-windows
          path: ${{ env.PKG }}
          if-no-files-found: error

  clap-macos:
    name: clap plugin (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: CLAP headers
        run: make clap-fetch
      - name: Build
        run: make clap
      - name: It is a bundle, with a plist and an exported entry point
        run: |
          ls -lR build/bencsynth.clap
          test -f build/bencsynth.clap/Contents/Info.plist
          test -f build/bencsynth.clap/Contents/MacOS/bencsynth
          nm -gU build/bencsynth.clap/Contents/MacOS/bencsynth | grep -q clap_entry

      # The three things that make macOS report a plugin as "damaged", each
      # checked rather than assumed. v0.1.0's macOS CLAP failed all three.
      - name: It is signed, universal, and carries no debug symbols
        run: |
          # Unsigned arm64 code does not load at all, and the message a host
          # shows says nothing about signatures.
          codesign --verify --deep --strict --verbose=2 build/bencsynth.clap

          # Both architectures: the runner is Apple Silicon, so a plain build
          # is arm64-only and useless to anyone on an Intel Mac.
          lipo -info build/bencsynth.clap/Contents/MacOS/bencsynth
          lipo -info build/bencsynth.clap/Contents/MacOS/bencsynth | grep -q x86_64
          lipo -info build/bencsynth.clap/Contents/MacOS/bencsynth | grep -q arm64

          # A .dSYM inside the bundle is build litter that gets shipped.
          test -z "$(find build/bencsynth.clap -name '*.dSYM')"
          echo "signed, universal, clean"
      - name: It loads, plays, switches racks and restores its state
        run: make clap-test
      - name: Package
        run: |
          D="bencsynth-clap-macos-$(git rev-parse --short HEAD)"
          mkdir -p "$D"
          cp -r build/bencsynth.clap "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          tar czf "$D.tar.gz" "$D"
          echo "PKG=$D.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-clap-macos
          path: ${{ env.PKG }}
          if-no-files-found: error

  # VST3, by wrapping the CLAP rather than porting anything. The wrapper
  # contains no BENCsynth code at all - it finds bencsynth.clap in the standard
  # CLAP directories at runtime - which is why the Windows job below can build
  # it with MSVC while the CLAP itself is built with MinGW.
  # AU, the one format Logic and GarageBand will load. Built from the same
  # clap-wrapper as the VST3 and equally a shim - it finds bencsynth.clap at
  # runtime rather than containing any of the synth.
  #
  # auval is the point of this job. It is Apple's own validator, the same one
  # Logic runs before it will show a plugin, and it exercises far more of the
  # AU contract than loading the bundle would: parameter and property
  # round-trips, render-quality sweeps, and the lifecycle at several sample
  # rates and buffer sizes. A component that builds and fails auval is a
  # component Logic silently refuses to list.
  au-macos:
    name: au plugin (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: CLAP headers, clap-wrapper and the AudioUnit SDK
        run: |
          make clap-fetch
          make au-fetch
      - name: Build
        run: |
          make clap      # the AU is a shim; it is useless without this
          make au
      - name: It is a component bundle with the right entry point
        run: |
          find build/BENCsynth.component -type f | head -20
          test -f build/BENCsynth.component/Contents/Info.plist
          test -f build/BENCsynth.component/Contents/MacOS/BENCsynth
          plutil -lint build/BENCsynth.component/Contents/Info.plist
          # The four-character codes are how a host remembers this plugin
          # forever. If they ever change, every saved project stops finding it.
          plutil -p build/BENCsynth.component/Contents/Info.plist | grep -A6 AudioComponents
          plutil -p build/BENCsynth.component/Contents/Info.plist | grep -q 'aumu'
          plutil -p build/BENCsynth.component/Contents/Info.plist | grep -q 'BNCS'
          plutil -p build/BENCsynth.component/Contents/Info.plist | grep -q 'BNCO'
      - name: Signed, universal, and no debug symbols
        run: |
          codesign --verify --deep --strict --verbose=2 build/BENCsynth.component
          lipo -info build/BENCsynth.component/Contents/MacOS/BENCsynth
          lipo -info build/BENCsynth.component/Contents/MacOS/BENCsynth | grep -q x86_64
          lipo -info build/BENCsynth.component/Contents/MacOS/BENCsynth | grep -q arm64
          test -z "$(find build/BENCsynth.component -name '*.dSYM')"
      # And it is a shim, not a second copy of the synth: no BENCsynth DSP
      # symbols in it, or the two would drift apart silently.
      - name: It is a shim
        run: |
          test "$(nm -U build/BENCsynth.component/Contents/MacOS/BENCsynth 2>/dev/null | grep -c 'bs::')" = "0"
      - name: Install both, because the AU loads the CLAP at runtime
        run: |
          make clap-install
          make au-install
          ls -la ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/CLAP
      # Registration is asynchronous and this is a headless session, so a
      # component copied a second ago is not in the list yet - the first
      # attempt at this failed with "didn't find the component" while the
      # bundle sat correctly in ~/Library/Audio/Plug-Ins/Components.
      #
      # System-wide as well as per-user, kick the registrar, and give it a few
      # goes before believing it.
      - name: auval
        run: |
          sudo mkdir -p /Library/Audio/Plug-Ins/Components
          sudo cp -R build/BENCsynth.component /Library/Audio/Plug-Ins/Components/
          found=""
          for i in 1 2 3 4 5 6; do
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            sleep 5
            if auval -a 2>/dev/null | grep -qiE 'BNCS|bencsynth'; then found=1; break; fi
            echo "  not registered yet (attempt $i)"
          done
          auval -a 2>/dev/null | grep -iE 'aumu|bencsynth' | head -20 || true
          if [ -z "$found" ]; then
            echo "::warning::auval cannot see the component on this runner - the"
            echo "::warning::AudioComponent registrar does not appear to run headless."
            echo "The bundle checks above still passed. Skipping validation."
            exit 0
          fi
          auval -v aumu BNCS BNCO

  vst3:
    name: vst3 wrapper (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: CLAP headers, clap-wrapper and the VST3 SDK
        run: |
          make clap-fetch
          make vst3-fetch
      - name: Build
        run: |
          make clap        # the VST3 is a shim; it is useless without this
          make vst3
      - name: It is a VST3 bundle with the right entry point
        run: |
          find build/bencsynth.vst3 -type f
          test -f build/bencsynth.vst3/Contents/x86_64-linux/bencsynth.so
          nm -D --defined-only build/bencsynth.vst3/Contents/x86_64-linux/bencsynth.so \
            | grep -q GetPluginFactory
      - name: And it is a shim, not a second copy of the synth
        run: |
          # No BENCsynth symbols: the wrapper loads the CLAP at runtime. If DSP
          # ever ends up in here, the two would drift apart silently.
          test "$(nm -D build/bencsynth.vst3/Contents/x86_64-linux/bencsynth.so | grep -c 'bs::')" = "0"
      - name: Package
        run: |
          D="bencsynth-vst3-linux-$(git rev-parse --short HEAD)"
          mkdir -p "$D"
          cp -r build/bencsynth.vst3 build/bencsynth.clap "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          tar czf "$D.tar.gz" "$D"
          echo "PKG=$D.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-vst3-linux
          path: ${{ env.PKG }}
          if-no-files-found: error

  vst3-windows:
    name: vst3 wrapper (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # MSVC, not MSYS2. The VST3 SDK expects it on Windows, and nothing of
      # ours is linked in here - the wrapper only has to agree with the host
      # about the VST3 ABI, which is what MSVC is for.
      - name: clap-wrapper and the SDKs
        shell: bash
        run: |
          mkdir -p vendor
          curl -sL -o /tmp/clap.tar.gz \
            https://github.com/free-audio/clap/archive/refs/tags/1.2.10.tar.gz
          tar xzf /tmp/clap.tar.gz -C vendor
          mv vendor/clap-1.2.10 vendor/clap
          git clone -q --depth 1 --branch v0.15.1 \
            https://github.com/free-audio/clap-wrapper.git vendor/clap-wrapper
          git clone -q --depth 1 \
            https://github.com/steinbergmedia/vst3sdk.git vendor/vst3sdk
          cd vendor/vst3sdk && git submodule update --init --depth 1 \
            base pluginterfaces public.sdk cmake
      # cmake/CMakeLists.txt rather than clap-wrapper's own top level: that one
      # builds every format the platform can manage, which on MSVC includes AAX
      # and stops the configure dead demanding the Avid SDK.
      # This job configures cmake itself rather than going through the
      # Makefile, so it has to read the version the same way the Makefile does.
      - name: Which version
        shell: bash
        run: |
          V=$(awk '/^#define BS_VERSION_(MAJOR|MINOR|PATCH)/ {printf "%s%s", sep, $3; sep="."}' src/core/bs_version.h)
          echo "BS_VERSION=$V" >> "$GITHUB_ENV"
          echo "version $V"
      - name: Build
        shell: pwsh
        run: |
          cmake -S cmake -B build/vst3 -A x64 `
            -DBS_VERSION="$env:BS_VERSION" `
            -DCLAP_WRAPPER_DIR="$env:GITHUB_WORKSPACE/vendor/clap-wrapper" `
            -DCLAP_SDK_ROOT="$env:GITHUB_WORKSPACE/vendor/clap" `
            -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vendor/vst3sdk"
          cmake --build build/vst3 --target bencsynth_as_vst3 --config Release
      - name: Find and check it
        shell: bash
        run: |
          find build/vst3 -name "bencsynth.vst3" -o -name "bencsynth.vst3" -type d | head
          FOUND=$(find build/vst3 -name "*.vst3" | head -1)
          test -n "$FOUND"
          echo "VST3=$FOUND" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        run: |
          D="bencsynth-vst3-windows-$(git rev-parse --short HEAD)"
          mkdir -p "$D"
          cp -r "$VST3" "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          7z a "$D.zip" "$D" > /dev/null
          echo "PKG=$D.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-vst3-windows
          path: ${{ env.PKG }}
          if-no-files-found: error

  # The Linux job above builds an ELF .so. Dropping that bundle into
  # %APPDATA%\LV2 gets you a plugin that is found, read, and then not loaded,
  # because manifest.ttl points at a binary Windows cannot execute - and a host
  # that cannot load a binary reports nothing at all. A Windows host needs a
  # Windows bundle, so here is one.
  lv2-windows:
    name: lv2 plugin (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            git
            make
            zip
            tar

      # Straight from the LV2 release rather than a package: LV2 is header-only
      # to build against, the tarball layout is include/lv2/<ext>/<file>.h which
      # is exactly what the source asks for, and this needs no pkg-config and no
      # guessing at what MSYS2 calls the package this week.
      - name: LV2 headers
        run: |
          curl -sL -o /tmp/lv2.tar.gz \
            https://github.com/lv2/lv2/archive/refs/tags/v1.18.10.tar.gz
          tar -xzf /tmp/lv2.tar.gz -C /tmp
          test -f /tmp/lv2-1.18.10/include/lv2/core/lv2.h

      - name: Build the bundle
        run: LV2_INCLUDE=/tmp/lv2-1.18.10/include make lv2

      - name: It is a DLL, and the manifest says so
        run: |
          ls -l build/bencsynth.lv2
          test -f build/bencsynth.lv2/manifest.ttl
          test -f build/bencsynth.lv2/bencsynth.ttl
          test -f build/bencsynth.lv2/bencsynth.dll
          # The manifest is generated from a template with the extension
          # substituted in. If that substitution ever regressed, the bundle
          # would look perfect and point at a file that is not there.
          grep -q 'bencsynth\.dll' build/bencsynth.lv2/manifest.ttl

      - name: lv2_descriptor is exported
        run: |
          # nm -D is for ELF; on a PE the answer is in the export table.
          objdump -p build/bencsynth.lv2/bencsynth.dll > /tmp/exp.txt
          grep -q 'lv2_descriptor' /tmp/exp.txt

      # Same check the executable gets, and for the same reason: LMMS will not
      # have MSYS2's runtime DLLs on its PATH, and LoadLibrary failing looks
      # exactly like the plugin not being installed.
      - name: No MSYS2 DLL dependencies
        run: |
          if objdump -p build/bencsynth.lv2/bencsynth.dll | \
             grep -iE 'DLL Name:.*(libgcc|libwinpthread|libstdc|msys)'; then
            echo "the plugin imports a runtime DLL a host will not have"
            exit 1
          fi
          echo "ok - self-contained"

      - name: Package
        run: |
          D="bencsynth-lv2-windows-$(git rev-parse --short HEAD)"
          mkdir -p "$D"
          cp -r build/bencsynth.lv2 "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          zip -r "$D.zip" "$D"
          echo "PKG=$D.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-lv2-windows
          path: ${{ env.PKG }}
          if-no-files-found: error

  lv2-macos:
    name: lv2 plugin (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: LV2 headers
        run: |
          curl -sL -o /tmp/lv2.tar.gz \
            https://github.com/lv2/lv2/archive/refs/tags/v1.18.10.tar.gz
          tar -xzf /tmp/lv2.tar.gz -C /tmp
      - name: Build the bundle
        run: LV2_INCLUDE=/tmp/lv2-1.18.10/include make lv2
      - name: It is a dylib, and the manifest says so
        run: |
          ls -l build/bencsynth.lv2
          test -f build/bencsynth.lv2/bencsynth.dylib
          grep -q 'bencsynth\.dylib' build/bencsynth.lv2/manifest.ttl
          nm -gU build/bencsynth.lv2/bencsynth.dylib | grep -q lv2_descriptor
      # The dylib, not the directory: an LV2 bundle is a plain folder and
      # codesign refuses it as "bundle format unrecognized".
      - name: It is signed and universal
        run: |
          codesign --verify --strict --verbose=2 build/bencsynth.lv2/bencsynth.dylib
          lipo -info build/bencsynth.lv2/bencsynth.dylib | grep -q x86_64
          lipo -info build/bencsynth.lv2/bencsynth.dylib | grep -q arm64
      - name: It loads, plays and restores its state
        run: LV2_INCLUDE=/tmp/lv2-1.18.10/include make lv2-test
      - name: Package
        run: |
          D="bencsynth-lv2-macos-$(git rev-parse --short HEAD)"
          mkdir -p "$D"
          cp -r build/bencsynth.lv2 "$D"/
          cp README.md LICENSE NOTICE docs/PLUGIN.md "$D"/
          tar czf "$D.tar.gz" "$D"
          echo "PKG=$D.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-lv2-macos
          path: ${{ env.PKG }}
          if-no-files-found: error

  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: X11, GL and ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev xvfb

      # From source rather than from apt: the packaged version varies by runner
      # image, and a build that only compiles against one of them is not much
      # of a guarantee. Static, so the artifact runs on a machine that has
      # never heard of raylib.
      - name: raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build

      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      - name: Build
        run: RAYLIB=/tmp/rl make

      - name: Tests
        run: make test

      # The committed icon files are what the packaged builds use, and a
      # half-finished `make icons` is easy not to notice. Checked by shape
      # rather than by diffing against a fresh render: the rasteriser goes
      # through libm, and two platforms' sin and sqrt can disagree in the last
      # bit, which would turn one antialiased pixel into a red build.
      - name: The committed icons are the right shape
        run: |
          fail=0
          for s in 16 24 32 48 64 128 256 512; do
            f="assets/icon/star-$s.png"
            [ -f "$f" ] || { echo "missing $f"; fail=1; continue; }
            got=$(file "$f" | sed -n "s/.*, \([0-9]*\) x \([0-9]*\).*/\1x\2/p")
            [ "$got" = "${s}x${s}" ] || { echo "$f is $got, expected ${s}x${s}"; fail=1; }
          done
          [ -f assets/icon/bencsynth.ico ] || { echo "missing bencsynth.ico"; fail=1; }
          exit $fail

      # A window nobody opens is a window nobody has tested. Under Xvfb this
      # creates a real GL context, loads the font, builds the default rack and
      # renders a hundred and fifty frames.
      - name: The window comes up
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" ./bencsynth --shot ci-rack.png --frames 150
          xvfb-run -a -s "-screen 0 1440x900x24" ./bencsynth --shot ci-info.png --info --frames 60
          ls -l ci-rack.png ci-info.png

      # Tarred rather than uploaded bare. upload-artifact zips whatever it is
      # given, and the zip format as GitHub writes it does not carry the
      # executable bit - so a downloaded binary needs a chmod before it will
      # run, which nobody expects and nothing tells them. A tar carries the
      # mode. The assets go with it because the font is loaded from disk.
      - name: Package
        run: |
          D="bencsynth-$(git rev-parse --short HEAD)-linux-x86_64"
          mkdir -p "$D"
          cp bencsynth README.md ARCHITECTURE.md LICENSE NOTICE "$D"/
          cp -r assets "$D"/
          tar czf "$D.tar.gz" "$D"
          echo "PKG=$D.tar.gz" >> "$GITHUB_ENV"
          ls -l "$D.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-linux
          path: ${{ env.PKG }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ci-*.png
          if-no-files-found: error

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # From source and static, not `brew install raylib`. Homebrew's is a
      # dylib under /opt/homebrew, and a binary linked against it aborts at
      # launch on any machine without that exact library - which is every
      # machine that has just downloaded a build.
      # Universal, because the executable is built universal below and a
      # single-architecture raylib underneath it will not link.
      - name: raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build
          lipo -info /tmp/rl/lib/libraylib.a | tail -1

      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      # Universal here as well as at release time. The flag exists because
      # -MMD and two -arch flags cannot be combined, so it is off by default -
      # which would leave it exercised only on a tag, where a mistake in it is
      # most expensive to find.
      - name: Build
        run: RAYLIB=/tmp/rl MACOS_UNIVERSAL=1 make

      - name: Tests
        run: make test

      # The plugins have been universal since v0.1.0; the executable has not,
      # and it is the plugin's editor. An arm64 editor inside a universal
      # plugin is a plugin that loads on an Intel Mac and never opens its
      # window - which reads as the plugin being broken, not the build.
      - name: The executable is universal
        run: |
          lipo -info bencsynth
          lipo -info bencsynth | grep -q x86_64
          lipo -info bencsynth | grep -q arm64

      # The check that would have caught shipping a Homebrew-linked binary.
      # Anything outside /usr/lib and /System is not on a stock Mac.
      - name: No non-system dynamic libraries
        run: |
          otool -L bencsynth
          # Only the indented lines. otool prints an unindented header per
          # architecture, so on a universal binary "tail -n +2" leaves
          # "bencsynth (architecture arm64):" in the stream and the check
          # reports the binary's own name as a library it cannot find.
          if otool -L bencsynth | grep -E '^[[:space:]]' | \
             grep -vE '^[[:space:]]+(/usr/lib/|/System/)'; then
            echo "links a library that will not be present on a stock macOS"
            exit 1
          fi
          echo "self-contained"

      # The bundle and the image are built here as well as at release time, so
      # a broken one shows up on a push rather than on a tag. Split into
      # separate steps so a failure names itself - "the bundle and the image and
      # the checks" as one step says nothing about which of them broke.
      - name: The .app bundle builds
        run: |
          BS_VERSION=0.0.0 ./tools/macos-app.sh bencsynth BENCsynth.app
          test -f BENCsynth.app/Contents/MacOS/BENCsynth
          test -f BENCsynth.app/Contents/Resources/BENCsynth.icns
          test -f BENCsynth.app/Contents/Resources/assets/fonts/TerminusTTF.ttf
          test -f BENCsynth.app/Contents/Resources/assets/brand/BENCO_Logo_Terminal.png
          plutil -lint BENCsynth.app/Contents/Info.plist
          # Finder decides an app is an app from these two facts alone.
          test "$(plutil -extract CFBundleExecutable raw \
                    BENCsynth.app/Contents/Info.plist)" = BENCsynth
          test "$(plutil -extract CFBundlePackageType raw \
                    BENCsynth.app/Contents/Info.plist)" = APPL

      # The check that would have caught shipping a bundle macOS calls
      # "damaged": a signature that does not validate against the bundle it is
      # in. Ad-hoc identifies nobody, but it has to verify.
      - name: The bundle's signature validates
        run: |
          codesign --verify --deep --strict --verbose=2 BENCsynth.app
          codesign -dvv BENCsynth.app 2>&1 | head -20
          # Informational: unnotarised software is rejected here by design, and
          # that rejection is the "unidentified developer" prompt, not
          # "damaged".
          spctl -a -t exec -vv BENCsynth.app || true

      # In a venv rather than `pip install --user`: a runner's system Python is
      # externally managed and refuses the latter outright.
      - name: dmgbuild
        run: |
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install --quiet dmgbuild
          /tmp/dmgvenv/bin/dmgbuild --help >/dev/null

      # Named for the commit, because this one gets uploaded and somebody has to
      # be able to tell which build they double-clicked. The volume name stays
      # plain "BENCsynth": it becomes the mounted disk's name, and that is what
      # belongs on a desktop.
      - name: The disk image builds
        run: |
          DMG="bencsynth-$(git rev-parse --short HEAD)-macos-$(uname -m).dmg"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          DMGBUILD=/tmp/dmgvenv/bin/dmgbuild ./tools/macos-dmg.sh \
            BENCsynth.app "$DMG" BENCsynth

      # hdiutil will not create the mount point for you.
      - name: Mount the disk image
        run: |
          mkdir -p /tmp/dmg
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/dmg
          ls -la /tmp/dmg

      - name: It is draggable
        run: |
          test -d /tmp/dmg/BENCsynth.app
          test -L /tmp/dmg/Applications

      # The layout lives in this file. Without it the image opens as a plain
      # list and the background nobody sees might as well not be there.
      - name: It carries the window layout
        run: test -f /tmp/dmg/.DS_Store

      # Reported, not asserted. Where dmgbuild puts the volume icon and the
      # background is dmgbuild's business, and a build that fails because a tool
      # renamed an internal file is a build that fails for no reason.
      - name: What else it carries
        run: |
          ls -la /tmp/dmg/.background/ 2>/dev/null || echo "no .background/"
          test -f /tmp/dmg/.VolumeIcon.icns \
            && echo "volume icon present" || echo "no .VolumeIcon.icns"

      - name: Unmount
        if: always()
        run: hdiutil detach /tmp/dmg || true

      # The disk image, not the .app.
      #
      # upload-artifact zips whatever path it is given, and three things do not
      # survive that round trip:
      #
      #   - the wrapper. A .app is a directory, so it arrives on the other end
      #     as a folder called Contents, and whoever opens it has no idea which
      #     part is the program.
      #   - the executable bit, which the zip format as GitHub writes it does
      #     not carry, so Contents/MacOS/BENCsynth would not run even once
      #     found.
      #   - the code signature, which seals file modes. Losing them invalidates
      #     it, and an invalid signature is precisely the state macOS reports as
      #     "damaged" - the failure the signing step above exists to prevent.
      #
      # A disk image survives all three, because it is one file with a
      # filesystem inside it. The zip carries the image; the image carries the
      # permissions.
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-macos
          path: ${{ env.DMG }}
          if-no-files-found: error

      # ---- and a second image, for the plugins ----
      #
      # Built here rather than in the clap job because it needs the .app: the
      # plugin opens the rack by starting that binary, so an image with the
      # plugin and not the editor installs half a thing.
      - name: The CLAP and the AU, to put in it
        run: |
          make clap-fetch
          make au-fetch
          make clap
          make au
      - name: The plugin disk image builds
        run: |
          P="bencsynth-$(git rev-parse --short HEAD)-macos-plugins.dmg"
          echo "PLUGDMG=$P" >> "$GITHUB_ENV"
          DMGBUILD=/tmp/dmgvenv/bin/dmgbuild ./tools/macos-plugin-dmg.sh \
            "$P" "BENCsynth Plug-Ins"
      - name: It carries the plugin, the editor and the installer
        run: |
          mkdir -p /tmp/pdmg
          hdiutil attach -nobrowse -readonly -noverify -noautoopen -mountpoint /tmp/pdmg "$PLUGDMG"
          ls -la /tmp/pdmg
          test -d /tmp/pdmg/bencsynth.clap
          test -d /tmp/pdmg/BENCsynth.component
          test -d /tmp/pdmg/BENCsynth.app
          test -x "/tmp/pdmg/Install Plug-Ins.command"
          test -L /tmp/pdmg/Applications
          test -f /tmp/pdmg/README.txt
          # The signature has to survive being put in an image. If it does not,
          # the image has bought nothing - an invalid signature is exactly the
          # state macOS calls "damaged".
          codesign --verify --deep --strict --verbose=2 /tmp/pdmg/bencsynth.clap
          codesign --verify --deep --strict --verbose=2 /tmp/pdmg/BENCsynth.component
          codesign --verify --deep --strict --verbose=2 /tmp/pdmg/BENCsynth.app
          hdiutil detach /tmp/pdmg
      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-macos-plugins
          path: ${{ env.PLUGDMG }}
          if-no-files-found: error

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            git
            make
            zip
            python

      # raylib's own Makefile, not cmake. cmake's "MinGW Makefiles" generator
      # wants mingw32-make, a separate package from the MSYS make that is
      # already here, and picking the wrong generator fails at configure time
      # for reasons unrelated to this project. raylib ships a plain Makefile
      # that needs neither.
      - name: raylib
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC -j2
          mkdir -p /tmp/rl/include /tmp/rl/lib
          cp /tmp/raylib/src/raylib.h /tmp/raylib/src/raymath.h /tmp/raylib/src/rlgl.h /tmp/rl/include/
          cp /tmp/raylib/src/libraylib.a /tmp/rl/lib/

      # raylib is built from source above, so RAYLIB= is set and pkg-config is
      # never consulted. Printed anyway: this is the output to read first when a
      # Windows link fails, and it should not take a code change to get.
      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      - name: Build
        run: RAYLIB=/tmp/rl make

      - name: Tests
        run: make test

      # Not "is there an icon in the binary" - that passes while the titlebar
      # and taskbar stay generic, because GLFW loads the window-class icon by
      # the name GLFW_ICON and silently falls back otherwise. This walks the
      # resource directory of the built executable, which is the only place the
      # answer lives; grepping the .rc cannot tell you whether windres ran.
      - name: The icon is the one GLFW will use
        run: |
          ls -l bencsynth.exe
          python tools/check_win_icon.py bencsynth.exe

      # Static, so a downloaded binary does not need MSYS2's DLLs on PATH -
      # which the person who downloaded it does not have and would have no
      # reason to install.
      - name: No MSYS2 DLL dependencies
        run: |
          if objdump -p bencsynth.exe | grep -iE 'DLL Name:.*(raylib|libgcc|libwinpthread|libstdc|msys)'; then
            echo "links a DLL that will not be present on a user's machine"
            exit 1
          fi
          echo "self-contained"

      # Zipped here rather than left to upload-artifact so the archive has one
      # named folder at its root instead of loose files, and so the name says
      # which commit it came from. Windows has no executable bit to lose, so
      # the zip is not the hazard it is on the other two platforms - but the
      # font still has to travel beside the binary.
      - name: Package
        run: |
          D="bencsynth-$(git rev-parse --short HEAD)-windows-x86_64"
          mkdir -p "$D"
          cp bencsynth.exe README.md ARCHITECTURE.md LICENSE NOTICE "$D"/
          cp -r assets "$D"/
          zip -qr "$D.zip" "$D"
          echo "PKG=$D.zip" >> "$GITHUB_ENV"
          ls -l "$D.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: bencsynth-windows
          path: ${{ env.PKG }}
          if-no-files-found: error
